<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Terminfindung</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6">
  <div id="app" class="max-w-xl mx-auto bg-white p-6 rounded shadow-md">
    <p class="text-gray-500">Lade App...</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, setDoc, addDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // TODO: Ersetze diese Config mit deiner echten aus der Firebase Console!
    const firebaseConfig = {
      apiKey: "DEIN_API_KEY",
      authDomain: "terminfindung-f7efb.firebaseapp.com",
      projectId: "terminfindung-f7efb",
      storageBucket: "terminfindung-f7efb.firebasestorage.app",
      messagingSenderId: "440640412286",
      appId: "DEINE_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const appDiv = document.getElementById("app");
    const urlParams = new URLSearchParams(window.location.search);
    const pollId = urlParams.get("id");

    if (!pollId) {
      // Admin-Ansicht: Umfrage erstellen
      appDiv.innerHTML = `
        <h1 class="text-xl font-bold mb-4">Neue Terminfindung</h1>
        <input id="title" placeholder="Titel der Umfrage" class="border p-2 w-full mb-3 rounded">
        <div id="options" class="space-y-2 mb-3"></div>
        <button id="addOpt" class="bg-gray-200 px-3 py-1 rounded text-sm">+ Option</button>
        <button id="create" class="bg-green-600 text-white px-4 py-2 rounded w-full mt-4">Umfrage Erstellen</button>
      `;
      const optDiv = document.getElementById("options");
      const addOpt = () => optDiv.insertAdjacentHTML('beforeend', '<input type="datetime-local" class="opt border p-2 w-full rounded">');
      addOpt(); // Start mit einem Feld
      document.getElementById("addOpt").onclick = addOpt;
      document.getElementById("create").onclick = async () => {
        const title = document.getElementById("title").value;
        const dates = Array.from(document.querySelectorAll(".opt")).map(i => i.value).filter(Boolean);
        if (!title || !dates.length) return alert("Bitte Titel und Termine angeben!");
        const docRef = await addDoc(collection(db, "polls"), { title, dates, votes: [] });
        appDiv.innerHTML = `
          <p class="mb-2 font-semibold text-green-600">Erfolgreich erstellt!</p>
          <p class="mb-2 text-sm">Teile diesen Link mit den Teilnehmern:</p>
          <input readonly value="${window.location.origin}?id=${docRef.id}" class="border p-2 w-full bg-gray-100 rounded text-sm">
        `;
      };
    } else {
      // Teilnehmer-Ansicht: Abstimmen
      onSnapshot(doc(db, "polls", pollId), (snapshot) => {
        if (!snapshot.exists()) return appDiv.innerHTML = "Umfrage nicht gefunden.";
        const poll = snapshot.data();
        let html = `<h1 class="text-xl font-bold mb-4">${poll.title}</h1><p class="mb-4 text-sm text-gray-500">Stimme für die Termine ab:</p>`;
        poll.dates.forEach(d => {
          html += `
            <div class="mb-3 p-3 bg-gray-100 rounded flex justify-between items-center">
              <span class="font-medium">${new Date(d).toLocaleString('de-DE')}</span>
              <div class="space-x-1">
                <button class="bg-green-500 text-white px-3 py-1 rounded text-xs">Ja</button>
                <button class="bg-yellow-500 text-white px-3 py-1 rounded text-xs">Zur Not</button>
                <button class="bg-red-500 text-white px-3 py-1 rounded text-xs">Nein</button>
              </div>
            </div>`;
        });
        appDiv.innerHTML = html;
      });
    }
  </script>
</body>
</html>
