<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminfindung</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-tr from-slate-100 via-indigo-50 to-slate-100 min-h-screen p-4 flex items-center justify-center font-sans">
  <div id="app" class="w-full max-w-xl bg-white/95 backdrop-blur-md p-6 rounded-2xl shadow-xl border border-slate-200/50">Lade App...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, addDoc, collection, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAJz3O1u8Es3UiEU-UPGu_cdS3YkojAWqU",
      authDomain: "terminfindung-f7efb.firebaseapp.com",
      projectId: "terminfindung-f7efb",
      storageBucket: "terminfindung-f7efb.firebasestorage.app",
      messagingSenderId: "440640412286",
      appId: "1:440640412286:web:3ee77fa650c6ba4f03562f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const appDiv = document.getElementById("app");
    const urlParams = new URLSearchParams(window.location.search);
    const pollId = urlParams.get("id");

    if (!pollId) {
      // Admin-Ansicht
      appDiv.innerHTML = `
        <h1 class="text-[32px] font-black mb-4 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 bg-clip-text text-transparent leading-none">Neue Terminfindung</h1>
        <input id="title" placeholder="Titel der Umfrage" class="border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all rounded-xl p-3 w-full mb-3 outline-none">
        <div id="options" class="space-y-2 mb-3"></div>
        <button id="addOpt" class="bg-slate-100 hover:bg-slate-200 text-slate-800 px-4 py-2 rounded-xl text-sm font-bold transition-all">+ Option hinzufügen</button>
        <button id="create" class="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white px-4 py-3 rounded-xl w-full mt-4 font-bold shadow-lg shadow-indigo-100 transition-all">Umfrage Erstellen</button>
      `;
      const optDiv = document.getElementById("options");
      const addOpt = () => optDiv.insertAdjacentHTML('beforeend', '<input type="datetime-local" class="opt border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all rounded-xl p-3 w-full outline-none">');
      addOpt();
      document.getElementById("addOpt").onclick = addOpt;
      document.getElementById("create").onclick = async () => {
        const title = document.getElementById("title").value;
        const dates = Array.from(document.querySelectorAll(".opt")).map(i => i.value).filter(Boolean);
        if (!title || !dates.length) return alert("Bitte Daten angeben!");
        const docRef = await addDoc(collection(db, "polls"), { title, dates, votes: [] });
        appDiv.innerHTML = `
          <h2 class="text-xl font-bold text-slate-800 mb-3">Erfolgreich erstellt! 🎉</h2>
          <input readonly value="${window.location.origin}?id=${docRef.id}" class="border border-slate-200 p-3 w-full bg-slate-50 rounded-xl text-sm outline-none text-slate-700 font-medium">
        `;
      };
    } else {
      // Teilnehmer-Ansicht
      let myChoices = {};
      let editingName = null;
      let activePoll = null;

      window.selectChoice = (date, choice, btnId) => {
        myChoices[date] = choice;
        document.querySelectorAll(`[data-date="${date}"]`).forEach(b => b.classList.remove("ring-4", "ring-indigo-500/50"));
        document.getElementById(btnId).classList.add("ring-4", "ring-indigo-500/50");
      };

      window.editVote = (name) => {
        editingName = name;
        const vote = activePoll.votes.find(v => v.name === name);
        if (vote) {
          myChoices = { ...vote.choices };
          document.getElementById("voterName").value = name;
          document.getElementById("voterName").disabled = true;
          document.getElementById("cancelEdit").classList.remove("hidden");
          activePoll.dates.forEach((d, idx) => {
            document.querySelectorAll(`[data-date="${d}"]`).forEach(b => b.classList.remove("ring-4", "ring-indigo-500/50"));
            const choice = myChoices[d];
            if (choice === 'ja') document.getElementById(`y-${idx}`).classList.add("ring-4", "ring-indigo-500/50");
            if (choice === 'not') document.getElementById(`m-${idx}`).classList.add("ring-4", "ring-indigo-500/50");
            if (choice === 'nein') document.getElementById(`n-${idx}`).classList.add("ring-4", "ring-indigo-500/50");
          });
        }
      };

      window.deleteVote = async (name) => {
        if (!confirm(`Stimme von ${name} wirklich löschen?`)) return;
        const updatedVotes = activePoll.votes.filter(v => v.name !== name);
        await updateDoc(doc(db, "polls", pollId), { votes: updatedVotes });
      };

      window.addNewDate = async () => {
        const newDate = document.getElementById("newDateInput").value;
        if (!newDate) return alert("Bitte Datum wählen!");
        if (activePoll.dates.includes(newDate)) return alert("Termin existiert bereits!");
        const updatedDates = [...activePoll.dates, newDate];
        await updateDoc(doc(db, "polls", pollId), { dates: updatedDates });
        document.getElementById("newDateInput").value = "";
      };

      window.deleteDate = async (dateToDelete) => {
        if (!confirm("Diesen Termin wirklich löschen?")) return;
        const updatedDates = activePoll.dates.filter(d => d !== dateToDelete);
        const updatedVotes = activePoll.votes.map(v => {
          const newChoices = { ...v.choices };
          delete newChoices[dateToDelete];
          return { name: v.name, choices: newChoices };
        });
        await updateDoc(doc(db, "polls", pollId), { dates: updatedDates, votes: updatedVotes });
      };

      window.cancelEditing = () => {
        editingName = null;
        myChoices = {};
        document.getElementById("voterName").value = "";
        document.getElementById("voterName").disabled = false;
        document.getElementById("cancelEdit").classList.add("hidden");
        document.querySelectorAll(`button[data-date]`).forEach(b => b.classList.remove("ring-4", "ring-indigo-500/50"));
      };

      window.saveVote = async () => {
        const name = document.getElementById("voterName").value.trim();
        if (!name) return alert("Namen eingeben!");
        if (Object.keys(myChoices).length === 0) return alert("Optionen wählen!");

        const voteList = activePoll.votes || [];
        const nameExists = voteList.some(v => v.name.toLowerCase() === name.toLowerCase());

        if (nameExists && !editingName) {
          return alert("Name existiert bereits!");
        }

        const updatedVotes = voteList.filter(v => v.name.toLowerCase() !== name.toLowerCase());
        updatedVotes.push({ name: editingName || name, choices: myChoices });

        await updateDoc(doc(db, "polls", pollId), { votes: updatedVotes });
        cancelEditing();
        alert("Erfolgreich gespeichert!");
      };

      onSnapshot(doc(db, "polls", pollId), (snapshot) => {
        if (!snapshot.exists()) return appDiv.innerHTML = "Nicht gefunden.";
        activePoll = snapshot.data();
        const voteList = activePoll.votes || [];

        const incompleteVoters = [];
        voteList.forEach(v => {
          const missingCount = activePoll.dates.filter(d => !v.choices[d]).length;
          if (missingCount > 0) incompleteVoters.push({ name: v.name, count: missingCount });
        });

        let html = `<h1 class="text-[32px] font-black mb-2 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 bg-clip-text text-transparent leading-none">${activePoll.title}</h1>`;

        if (incompleteVoters.length > 0) {
          html += `
            <div class="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 p-3 rounded-xl text-xs mb-4 text-amber-800 shadow-sm">
              <strong class="font-bold block mb-1">⚠️ Neue Termine hinzugefügt!</strong>
              Folgende Personen müssen ihre Stimme noch vervollständigen:
              <ul class="list-disc ml-4 mt-1 space-y-1 font-medium">
                ${incompleteVoters.map(iv => `
                  <li>
                    ${iv.name} 
                    <button onclick="editVote('${iv.name}')" class="text-indigo-600 underline ml-1 hover:text-indigo-800 font-bold">Ausfüllen ✏️</button>
                  </li>`).join('')}
              </ul>
            </div>`;
        }

        html += `
          <div class="mb-4">
            <input id="voterName" placeholder="Dein Name" class="border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all rounded-xl p-3 w-full mb-2 outline-none text-slate-700">
            <button id="cancelEdit" onclick="cancelEditing()" class="hidden bg-slate-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition-all shadow-sm">Bearbeiten abbrechen</button>
          </div>`;

        activePoll.dates.forEach((d, idx) => {
          html += `
            <div class="mb-3 p-3 bg-white border border-slate-100 rounded-xl flex justify-between items-center shadow-sm hover:border-indigo-100 transition-all">
              <span class="font-bold text-xs text-slate-700">${new Date(d).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' })}</span>
              <div class="space-x-1">
                <button id="y-${idx}" data-date="${d}" onclick="selectChoice('${d}','ja','y-${idx}')" class="bg-gradient-to-r from-emerald-400 to-teal-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition-all shadow-sm">Ja</button>
                <button id="m-${idx}" data-date="${d}" onclick="selectChoice('${d}','not','m-${idx}')" class="bg-gradient-to-r from-amber-400 to-orange-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition-all shadow-sm">Zur Not</button>
                <button id="n-${idx}" data-date="${d}" onclick="selectChoice('${d}','nein','n-${idx}')" class="bg-gradient-to-r from-rose-400 to-red-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition-all shadow-sm">Nein</button>
              </div>
            </div>`;
        });
        html += `<button onclick="saveVote()" class="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white px-4 py-3 rounded-xl w-full mt-2 font-bold shadow-lg shadow-indigo-100 transition-all">Stimme speichern</button>`;

        const dateStats = activePoll.dates.map(d => {
          let yes = 0, not = 0;
          const userVotes = {};
          voteList.forEach(v => {
            const choice = v.choices[d];
            userVotes[v.name] = choice;
            if (choice === 'ja') yes++;
            if (choice === 'not') not++;
          });
          const score = (yes * 2) + (not * 1);
          return { date: d, yes, not, score, userVotes };
        }).sort((a, b) => b.score - a.score);

        html += `<h2 class="text-md font-bold mt-6 border-t pt-4 text-slate-800">Ergebnisse</h2>`;

        if (voteList.length === 0) {
          html += `<p class="text-gray-400 text-xs mt-2">Noch keine Stimmen abgegeben.</p>`;
        } else {
          html += `
            <div class="overflow-x-auto mt-3 border border-slate-100 rounded-xl shadow-sm bg-white">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-100">
                    <th class="p-3 text-xs font-bold text-slate-700">Termin</th>
                    ${voteList.map(v => `
                      <th class="p-3 text-center text-xs font-bold text-slate-700 border-l border-slate-100 relative">
                        <div class="truncate max-w-[85px] mx-auto text-slate-700 font-black" title="${v.name}">${v.name}</div>
                        <div class="flex justify-center gap-1 mt-1.5">
                          <button onclick="editVote('${v.name}')" class="bg-white hover:bg-slate-50 text-slate-800 px-1.5 py-0.5 rounded-md text-[10px] border border-slate-200 font-bold transition-all shadow-sm">✏️</button>
                          <button onclick="deleteVote('${v.name}')" class="bg-white hover:bg-red-50 text-red-500 px-1.5 py-0.5 rounded-md text-[10px] border border-slate-200 font-bold transition-all shadow-sm">🗑️</button>
                        </div>
                      </th>
                    `).join('')}
                  </tr>
                </thead>
                <tbody>
                  ${dateStats.map((s, idx) => {
                    const dStr = new Date(s.date).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' });
                    return `
                      <tr class="border-b border-slate-100 hover:bg-slate-50/50 transition-all">
                        <td class="p-3 text-xs font-semibold text-slate-700 ${idx === 0 ? 'bg-emerald-50/30 border-l-4 border-emerald-500' : ''}">${dStr} <span class="text-[10px] font-normal text-slate-400">(${s.score} Pkt.)</span></td>
                        ${voteList.map(v => {
                          const choice = s.userVotes[v.name];
                          let icon = '❌';
                          let cl = 'text-red-500 bg-red-50/10';
                          if (choice === 'ja') { icon = '✅'; cl = 'text-green-500 bg-green-50/20 font-bold'; }
                          else if (choice === 'not') { icon = '🟡'; cl = 'text-yellow-500 bg-yellow-50/10'; }
                          else if (choice === undefined) { icon = '❓'; cl = 'text-slate-300 bg-slate-50/50'; }
                          return `<td class="p-3 text-center border-l border-slate-100 text-sm ${cl}">${icon}</td>`;
                        }).join('')}
                      </tr>`;
                  }).join('')}
                </tbody>
              </table>
            </div>`;
        }

        html += `
          <details class="mt-6 border-t border-slate-100 pt-4">
            <summary class="cursor-pointer text-xs font-bold text-slate-500 select-none flex justify-between items-center hover:text-slate-800 transition-all">
              <span>⚙️ Admin-Bereich (Termine verwalten)</span>
              <span class="text-[10px] text-slate-400">▼ Klick zum Ausklappen</span>
            </summary>
            <div class="mt-3 bg-slate-50/50 p-4 rounded-xl border border-slate-100">
              <div class="space-y-1 mb-3">
                ${activePoll.dates.map(d => `
                  <div class="flex justify-between items-center text-xs text-slate-500">
                    <span>${new Date(d).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' })}</span>
                    <button onclick="deleteDate('${d}')" class="text-red-500 hover:text-red-700 font-semibold text-[10px] transition-all">Löschen 🗑️</button>
                  </div>
                `).join('')}
              </div>
              <div class="flex gap-2">
                <input type="datetime-local" id="newDateInput" class="border border-slate-200 p-2 text-xs rounded-xl w-full outline-none focus:border-indigo-500">
                <button onclick="addNewDate()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-sm">+ Hinzufügen</button>
              </div>
            </div>
          </details>`;

        appDiv.innerHTML = html;
      });
    }
  </script>
</body>
</html>
